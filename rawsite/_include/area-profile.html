<script type="text/python">
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S

area_id = params["area"]
lang = S.lang_of(page_file)
area = S.AREAS[area_id]
facts = S.AREA_FACTS[area_id]

            url = S.localize(spot["url"], lang)
            label = f'<a href="{url}">{label}</a>'
        spots.append(label)
print('<p>' + ' · '.join(spots) + '</p>')
