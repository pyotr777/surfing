<script type="text/python">
# The map. A label-free illustrated Japan map is used as a flat backdrop.
# Each pin is positioned against its hand-drawn coastline at build time.
#
# Parameters (all optional):
#   highlight  spot id to emphasise; all others are dimmed
#   mini       True for the compact version used on a spot page
#   linked     False to render pins without links (used on the spot's own page)
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S

highlight = params.get("highlight")
mini = params.get("mini", False)
linked = params.get("linked", True)

lang = S.lang_of(page_file)
ui = S.UI[lang]
b = S.base_url(page_file)

W, H = S.MAP["width"], S.MAP["height"]
basemap = os.path.join(S.ROOT, "img", "kanto-tokai-illustrated-map.png")
has_basemap = os.path.exists(basemap)

classes = "surfmap" + (" surfmap--mini" if mini else "")
print(f'<figure class="{classes}">')
print('  <div class="surfmap-frame">')
print(f'  <svg viewBox="0 0 {W} {H}" xmlns="http://www.w3.org/2000/svg"'
      f' role="img" aria-label="{ui["map_heading"]}">')

if has_basemap:
    print(f'    <image href="{b}img/kanto-tokai-illustrated-map.png" x="0" y="0"'
          f' width="{W}" height="{H}" preserveAspectRatio="none"/>')
else:
    # The site still builds without the basemap file, it just looks plainer.
    print(f'    <rect x="0" y="0" width="{W}" height="{H}" fill="#14527f"/>')
    print(f'    <text x="{W/2}" y="{H/2}" text-anchor="middle" fill="#9ec9dc"'
          f' font-size="16">img/kanto-tokai-illustrated-map.png is missing</text>')

if not mini:
    for area_id, (x, y) in S.MAP["area_labels"].items():
        meta = S.AREAS_META[area_id]
        url = b + f'spots/{area_id}/'
        print(f'    <a class="spot-marker" href="{url}" aria-label="{meta[lang]}">')
        print(f'      <text class="pin-label" x="{x:.1f}" y="{y:.1f}" text-anchor="middle">'
              f'{meta[lang]}</text>')
        print('    </a>')

print('  </svg>')
print('  </div>')

if not mini:
    print('  <figcaption>')
    print(f'    <span class="map-note">{ui["map_caption"]}</span>')
    print('  </figcaption>')

print('</figure>')
</script>
