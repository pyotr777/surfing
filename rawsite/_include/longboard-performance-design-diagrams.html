<script type="text/python">
# Localized captions for the raster diagrams on the high-performance longboard
# page. The pictures themselves remain free of text so one set works across the
# site's languages.
import html
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S
import longboard_content as L

lang = S.lang_of(page_file)
b = S.base_url(page_file)
copy = [(item["filename"], item["title"], item["alt"], item["caption"])
        for item in L.LONGBOARDS["performance"][lang]["diagrams"]]

print('<style>.performance-design-diagram img{display:block;width:100%;height:auto}</style>')
print('<div class="performance-design-diagrams">')
for filename, title, alt, caption in copy:
    print('  <figure class="performance-design-diagram">')
    print(f'    <img src="{b}img/longboard-performance/{filename}" alt="{html.escape(alt, quote=True)}" width="1536" height="1024" loading="lazy">')
    print(f'    <figcaption><strong>{html.escape(title)}</strong><span>{html.escape(caption)}</span></figcaption>')
    print('  </figure>')
print('</div>')
</script>
