# Everything in <head> that is the same on every page.
# The <title> and the <meta> tags that describe the page stay in the page
# itself -- feed.html and pagetags.html read them straight out of the source.
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S

lang = S.lang_of(page_file)
other_lang = "en" if lang == "ru" else "ru"
b = S.base_url(page_file)

print('<meta name="viewport" content="width=device-width, initial-scale=1">')
