<script type="text/python">
# The facts panel on a spot page, built from one row of csv/spots.csv.
# The page supplies only the spot id; every label is translated here.
#
# Parameters:
#   spot  id matching the id column of csv/spots.csv
import os
import sys
import html

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S

lang = S.lang_of(page_file)
ui = S.UI[lang]

detail = S.SPOT_DETAILS.get(params["spot"])
if detail:
    rows = detail["facts"][lang]
else:
    row = S.spot_by_id(params["spot"])
    rows = [
        (ui["table_region"], S.REGIONS[row["region"]][lang]),
        (ui["table_break"], S.BREAKS[row["break_type"]][lang]),
        (ui["table_level"], S.LEVELS[row["level"]][lang]),
        (ui["table_season"], S.SEASONS[row["peak_season"]][lang]),
        (ui["table_swell"], row["swell_window"]),
        (ui["table_wind"], row["best_wind"]),
        (ui["table_size"], row["size_ft_typical"] + " ft"),
        (ui["table_aug"], f'{row["water_aug_c"]} °C'),
        (ui["table_feb"], f'{row["water_feb_c"]} °C'),
    ]

print('<aside class="facts">')
print(f'  <h2>{ui["facts_heading"]}</h2>')
print('  <dl>')
bottom_icons = {
    "Sand": "seabed-sand-engraved-v1.png",
    "Песчаное": "seabed-sand-engraved-v1.png",
    "砂地": "seabed-sand-engraved-v1.png",
    "Rocks": "seabed-cobbles-engraved-v1.png",
    "Boulders": "seabed-cobbles-engraved-v1.png",
    "Cobblestones": "seabed-cobbles-engraved-v1.png",
    "Камни": "seabed-cobbles-engraved-v1.png",
    "Булыжники": "seabed-cobbles-engraved-v1.png",
    "玉石": "seabed-cobbles-engraved-v1.png",
    "Sand + Rocks": "seabed-sand-cobbles-engraved-v1.png",
    "Sand + Boulders": "seabed-sand-cobbles-engraved-v1.png",
    "Sand & Rocks": "seabed-sand-cobbles-engraved-v1.png",
    "Песок + камни": "seabed-sand-cobbles-engraved-v1.png",
    "砂と玉石": "seabed-sand-cobbles-engraved-v1.png",
    "Reef": "seabed-reef-engraved-v1.png",
    "Rock Reef": "seabed-reef-engraved-v1.png",
    "Риф": "seabed-reef-engraved-v1.png",
    "Скальный риф": "seabed-reef-engraved-v1.png",
    "岩棚": "seabed-reef-engraved-v1.png",
    "Sand + Reef": "seabed-sand-reef-engraved-v1.png",
    "Sand & Reef": "seabed-sand-reef-engraved-v1.png",
    "Песок + риф": "seabed-sand-reef-engraved-v1.png",
    "砂と岩棚": "seabed-sand-reef-engraved-v1.png",
}

for label, value in rows:
    if label in {"Bottom", "Seabed", "Дно", "海底"}:
        icon_name = bottom_icons.get(value)
        print(f'    <div><dt>{html.escape(label)}</dt><dd class="fact-bottom">')
        if icon_name:
            icon = S.base_url(page_file) + "img/stickers/" + icon_name
            print(f'      <img src="{html.escape(icon, quote=True)}" alt="{html.escape(value, quote=True)}" title="{html.escape(value, quote=True)}">')
        else:
            print(html.escape(value))
        print('    </dd></div>')
    else:
        print(f'    <div><dt>{html.escape(label)}</dt><dd>{html.escape(value)}</dd></div>')

amenities = detail.get("amenities", [])
if amenities:
    amenities_label = {"en": "Amenities", "ru": "Удобства", "ja": "設備"}[lang]
    print(f'    <div class="fact-amenities"><dt>{amenities_label}</dt><dd>')
    for kind in amenities:
        amenity = S.AMENITY_META[kind]
        label = amenity["label"][lang]
        icon = S.base_url(page_file) + "img/stickers/" + amenity["icon"]
        print(f'        <img src="{html.escape(icon, quote=True)}" alt="{html.escape(label, quote=True)}" title="{html.escape(label, quote=True)}">')
    print('      </dd></div>')
print('  </dl>')
diagrams, soup = include("spot-direction-diagrams.html", spot=params["spot"])
print(f'<div class="spot-directions">{diagrams}</div>')
print('</aside>')
</script>
