<script type="text/python">
# Table of contents for the front page.
#
# The sections and their order come from sitedata.SECTIONS; the page counts
# come from counting files on disk. Nothing here is written by hand, so a new
# page in any section shows up in the count without anyone remembering to
# update it.
import glob
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S

lang = S.lang_of(page_file)
ui = S.UI[lang]
suffix = S.localize("index.html", lang)

print('<nav class="toc" aria-label="' + ui["toc_heading"] + '">')
print('  <ol>')
for i, section in enumerate(S.SECTIONS, start=1):
    meta = S.SECTION_META[section][lang]
    paths = glob.glob(os.path.join(S.ROOT, section, "*", suffix))
    # Gun source files are intentionally retained but no longer belong to the
    # public Chiba board guide, so they do not inflate the visible page count.
    if section == "gear":
        visible_board_ids = {row["id"] for row in S.display_boards()}
        paths = [path for path in paths
                 if os.path.basename(os.path.dirname(path)) not in S.BOARDS_META
                 or os.path.basename(os.path.dirname(path)) in visible_board_ids]
    # Safety currently starts with its landing page rather than child guides.
    count = len(paths) or (1 if section == "safety" else 0)
    print(f'    <li class="toc-item">')
    print(f'      <a href="{S.section_url(section, page_file)}">')
    print(f'        <span class="toc-num">{i:02d}</span>')
    print(f'        <span class="toc-text">')
    print(f'          <span class="toc-title">{meta["title"]}</span>')
    print(f'          <span class="toc-blurb">{meta["blurb"]}</span>')
    print(f'        </span>')
    print(f'        <span class="toc-count">{count}&nbsp;{S.page_count_label(count, lang)}</span>')
    print(f'      </a>')
    print(f'    </li>')
print('  </ol>')
print('</nav>')
</script>
