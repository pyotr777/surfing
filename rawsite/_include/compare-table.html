<script type="text/python">
# Compare spots with detailed pages; unknown values are shown as a dash.
import os
import sys

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
import sitedata as S
from spots import SPOTS, spot_url

lang = S.lang_of(page_file)
ui = S.UI[lang]
b = S.base_url(page_file)

columns = [
    ("region", ui["table_region"], "text"),
    ("area", ui["table_area"], "text"),
    ("spot", ui["table_spot"], "text"),
    ("break", ui["table_break"], "text"),
    ("swell", ui["table_swell"], "text"),
    ("wind", ui["table_wind"], "direction"),
    ("size", f'{ui["table_size"]}, ft', "text"),
    ("aug", ui["table_aug"], "number"),
    ("feb", ui["table_feb"], "number"),
]

print(f'<p class="hint">{ui["table_sort_hint"]}</p>')
print('<div class="table-wrap">')
print('<table class="compare" id="compare">')
print('  <thead><tr>')
for key, label, kind in columns:
    print(f'    <th scope="col" data-sort="{kind}"><button type="button">{label}</button></th>')
print('  </tr></thead>')
print('  <tbody>')

for spot_id, row in SPOTS.items():
    if not spot_url(spot_id):
        continue
    area_id = row["area"]
    directions = {kind: row.get(kind, "") for kind in ("swell", "wind")}
    area_href = b + f'spots/{area_id}/' + S.localize("index.html", lang)
    spot_name = row["title"][lang]
    url = spot_url(spot_id)
    spot_href = b + f'spots/{area_id}/' + S.localize(url, lang) if url else area_href
    print('    <tr>')
    print(f'      <td>{S.REGIONS[row["region"]][lang] if row.get("region") else "—"}</td>')
    print(f'      <th scope="row"><a href="{area_href}">{S.AREAS_META[area_id][lang]}</a></th>')
    print(f'      <td><a href="{spot_href}">{spot_name}</a></td>')
    print(f'      <td>{S.BREAKS[row["break_type"]][lang] if row.get("break_type") else "—"}</td>')
    swell_html = "—"
    if directions["swell"]:
        swell_html, soup = include("../_include/compact-direction.html", kind="swell", swell_window=directions["swell"], best_wind=directions["wind"])
    wind_html = "—"
    if directions["wind"]:
        wind_html, soup = include("../_include/compact-direction.html", kind="wind", swell_window=directions["swell"], best_wind=directions["wind"])
    print(f'      <td class="direction-cell"><span class="sr-only">{directions["swell"]}</span>{swell_html}</td>')
    print(f'      <td class="direction-cell"><span class="sr-only">{directions["wind"]}</span>{wind_html}</td>')
    print(f'      <td class="mono">{str(row["size_ft_typical"]) + " ft" if row.get("size_ft_typical") else "—"}</td>')
    print(f'      <td class="num">{row.get("water_aug_c", "—")}</td>')
    print(f'      <td class="num">{row.get("water_feb_c", "—")}</td>')
    print('    </tr>')

print('  </tbody>')
print('</table>')
print('</div>')
</script>
